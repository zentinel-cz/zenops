      responses:
        "201":
          description: Záznam vytvořen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubcontractorDailyRecord"

  /subcontractor-daily-records/{id}:
    put:
      operationId: updateSubcontractorDailyRecord
      tags: [subcontractorDailyRecords]
      summary: Upravit vlastní denní záznam subdodavatele
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
