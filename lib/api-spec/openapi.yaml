      summary: Denní záznamy subdodavatelů pro vlastní firmu nebo admina
      parameters:
        - in: query
          name: month
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Seznam denních záznamů
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubcontractorDailyRecord"
    post:
      operationId: createSubcontractorDailyRecord
      tags: [subcontractorDailyRecords]
      summary: Vytvořit denní záznam vlastní subdodavatelské firmy
      requestBody:
        required: true
        content:
          application/json:
            schema:
