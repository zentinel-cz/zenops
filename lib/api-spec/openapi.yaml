openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API pro evidenci denních pracovních záznamů - Kácení a Sečení
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Autentizace
  - name: users
    description: Správa uživatelů
  - name: workers
    description: Pracovníci
  - name: vehicles
    description: Vozidla
  - name: machines
    description: Stroje
  - name: regions
    description: Revíry / oblasti
  - name: weatherTypes
    description: Typy počasí
  - name: fellingRecords
    description: Záznamy kácení
  - name: mowingRecords
    description: Záznamy sečení
  - name: subcontractorDailyRecords
    description: Denní záznamy subdodavatelů
  - name: dashboard
    description: Přehled a statistiky

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Přihlášení uživatele
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Přihlášení úspěšné
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Neplatné přihlašovací údaje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Odhlášení uživatele
      responses:
        "200":
          description: Odhlášení úspěšné
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
