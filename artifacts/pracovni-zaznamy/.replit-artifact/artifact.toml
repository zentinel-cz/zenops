kind = "web"
previewPath = "/"
title = "Pracovní záznamy"
version = "1.0.0"
id = "artifacts/pracovni-zaznamy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21376

[services.development]
run = "pnpm --filter @workspace/pracovni-zaznamy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pracovni-zaznamy", "run", "build" ]
publicDir = "artifacts/pracovni-zaznamy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21376"
BASE_PATH = "/"
